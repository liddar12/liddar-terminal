[project]
name = "signals"
version = "0.0.1"
description = "Clean-room technical indicators and a market-data provider interface."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["signals*"]
